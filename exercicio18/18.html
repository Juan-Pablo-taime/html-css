<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>fontes externas</title>
    <!--use o google fontes usando a opção import deles-->
    <style>
        /* usando fonte externa baixada */
        @font-face {
            font-family: aids;
            src: url(Tourner.ttf);
        }
        @import url('https://fonts.googleapis.com/css2?family=Bytesized&family=Press+Start+2P&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        body {
            font-family: "Press Start 2P", system-ui;
            font-weight: 400;
            font-style: normal;
            font-size: large;
                }
        h1{
            font-family: "Bytesized", sans-serif;
            font-weight: 400;
            font-style: normal;
        }
        h2{
            font-family: aids;
            font-weight: 400;
            font-style: normal;
        }
    </style>
</head>
<body>
    <h1>título</h1>
    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Voluptate reprehenderit sit velit commodi nulla perferendis magni, iure animi quia tempore necessitatibus unde culpa cumque beatae fuga asperiores veniam consectetur facere!</p>
    <h2>eita cuzaum</h2>
</body>
</html>
