<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <style>
         body {
                font-family: Arial, Helvetica, sans-serif;
            }
            table {
                border-collapse: collapse;
                width: 500px;
            }
            caption{
                font-size: 1.3em;
                font-weight: bolder;
                padding: 8px;
            }
            td, th {
                border: 1px solid black;
                padding: 8px;
            }
            .destaque {
                background-color: rgba(0, 0, 0, 0.438);
            }
            col.cnome {
                background-color: rgba(0, 0, 255, 0.514);
            }
            col.cgrupo {
                background-color: blueviolet;
            }
     </style>
    <title>Document</title>
</head>
<body>
    <h1>exercicio tabela</h1>
    <table>
        <colgroup>
            <col class="cnome">
            <col class="cgrupo" span="2"> <!-- span = 2 colunas se torna 1-->
            <col class="cprof">
        </colgroup>
        <caption>cadastro</caption>
        <tr>
            <th scope="colgroup">nome</th>
            <th scope="colgroup">sexo</th>
            <th scope="colgroup">idade</th>
            <th scope="colgroup">profissão</th>
        </tr>
        <tr>
            <td> Ana Maria </td>
            <td>f</td>
            <td>25</td>
            <td>jornalista</td>
        </tr>
        <tr>
            <td>Cláudio</td>
            <td>M</td>
            <td>28</td>
            <td>Programador</td>
        </tr>
        <tr>
            <td>Gustavo</td>
            <td>M</td>
            <td>42</td>
            <td>Professor</td>
        </tr>
        <tr>
            <td>Hélio</td>
            <td>M</td>
            <td>19</td>
            <td>Vendedor</td>
        </tr>
        <tr>
            <td>Maria</td>
            <td>F</td>
            <td>39</td>
            <td>Médica</td>
        </tr>
        <tr>
            <td>Otavio</td>
            <td>M</td>
            <td>22</td>
            <td>Nutricionista</td>
        </tr>
    </table>
</body>
</html>
