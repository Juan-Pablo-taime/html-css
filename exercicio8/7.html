<body>
    <h1>principais formatações</h1>
    <p><b>negrito</b></p>
    <p><i>italico</i></p>
    <p><strong>termo em destaque</strong></p>
    <p><em>teste</em></p>
    <p><mark>tbm podemos marcar o texto</mark></p>
    <p>é possivel <del>deletar um texto</del></p>
    <p>tbm podemos <ins>sublinhar o texto </ins>o correto seria usar "ins" ao inves de u</p>
    <p>é possivel usar texto sobescrito com "sub" 2<sup>2</sup>=4</p>
    <p>tbm é possivel usar texto subescreito com "sup" h<sub>2</sub>o</p>
</body>
