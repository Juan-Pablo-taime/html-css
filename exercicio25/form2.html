<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>contTrenforms</title>
</head>
<body>
    <h1>teste de formulario</h1>
    <form action="cadastro.HTML" method="post" target="_blank" autocomplete="on">
        <p>
            <label for="iusu">usuario</label>
            <input type="text" name="usu" id="iusu" required minlength="5" maxlength="15" size="50" placeholder="nome de usu" autocomplete="username">
        </p>
        <p>
            <label for="isen"> senha</label>
            <input type="password" name="sen" id="isen" required minlength="8" size="2" placeholder="senha do usu" autocomplete="current-password">
        </p>
        <p>
            <input type="submit" value="enviar">
            <input type="reset" value="resetar">
        </p>

    </form>
</body>
</html>
