<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>form10</title>
</head>
<body>
    <img src="https://thumb.wikimedia.org/wikipedia/commons/thumb/9/98/Tom_Lea_-_2000_Yard_Stare.jpg/960px-Tom_Lea_-_2000_Yard_Stare.jpg?utm_source=pt.wikipedia.org&utm_campaign=index&utm_content=thumbnail" alt="olhar de mil picas">

    <form action="cadastro.HTML" method="get" autocomplete="on">

        <p>
            <label for="iano">em que ano vc nasceu?</label>
            <input type="number" name="ano" id="iano" min="1900" max="2026" value="2000" oninput="calcIdade()">
        </p>


        <p>
            <label for="iidade">Sua idade é:</label>
            <output name="idade" id="iidade">0</output>
        </p>


        <p>
            <input type="submit" value="enviar">
            <input type="reset" value="limpar">
        </p>
    </form>
    <script>
        function calcIdade(){
            let atual = new Date().getFullYear()
            iidade.innerHTML = (Number(atual) - Number(iano.value)) 
            
        }
    </script>
</body>
</html>
