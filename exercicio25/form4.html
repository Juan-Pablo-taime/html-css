<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>aprendendo forms 4</title>
</head>
<body>
    <h1>exemplo de formulario</h1>
    <form action="cadastro.HTML">
        <fieldset>
            <legend>dados pessoais</legend>
            <p>
                <label for="inome">nome da pessoa</label>
                <input type="text" name="nome" id="inome" minlength="5" maxlength="20" required>
            </p>
            <p>
                <label for="iemail">email</label>
                <input type="email" name="email" id="iemail" autocomplete="email" required>
            </p>
            <p>
                <label for="itel">telefone</label>
                <input type="tel" name="tel" id="itel" autocomplete="tel" pattern="[0-9]{4}-[0-9]{4}" required>
            </p>
        </fieldset>
        <!--estudar mais sobre Regex regular expressions-->
        <p>
            <input type="submit" value="enviar">
            <input type="reset" value="limpar">
        </p>
        
    </form>
</body>
</html>
